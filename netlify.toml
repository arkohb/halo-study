# Netlify configuration - static site, no build step.

[build]
  publish = "."
  command = ""

# Pretty URLs: /bece instead of /bece.html
[[redirects]]
  from = "/bece"
  to = "/bece.html"
  status = 200
[[redirects]]
  from = "/wassce"
  to = "/wassce.html"
  status = 200
# old links from the previous version keep working
[[redirects]]
  from = "/maths"
  to = "/wassce.html"
  status = 301
[[redirects]]
  from = "/maths.html"
  to = "/wassce.html"
  status = 301
[[redirects]]
  from = "/english.html"
  to = "/wassce.html"
  status = 301
[[redirects]]
  from = "/science.html"
  to = "/wassce.html"
  status = 301
[[redirects]]
  from = "/social.html"
  to = "/wassce.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML: always revalidate, so students get updates as soon as you redeploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and the share image rarely change
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
